name: Work item
description: A scoped requirement, bug or improvement
title: ""
body:
  - type: textarea
    id: requirement
    attributes:
      label: Requirement / problem
      description: Describe the current behavior and the expected result.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable outcomes and any required verification.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints and evidence
      description: Scope exclusions, invariants, reproduction steps or screenshots.
