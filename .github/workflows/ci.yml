name: Scaffold verify
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Scaffold verify
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install the pinned Gitleaks test dependency
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            arm64) arch=arm64; sha=b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5 ;;
            x86_64) arch=x64; sha=dfe101a4db2255fc85120ac7f3d25e4342c3c20cf749f2c20a18081af1952709 ;;
            *) exit 1 ;;
          esac
          tools_dir="$(mktemp -d)"
          archive="$tools_dir/gitleaks.tgz"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_darwin_${arch}.tar.gz" -o "$archive"
          echo "$sha  $archive" | shasum -a 256 --check
          tar -xzf "$archive" -C "$tools_dir" gitleaks
          echo "$tools_dir" >> "$GITHUB_PATH"
      - run: bash .github/scripts/verify-scaffold.sh
